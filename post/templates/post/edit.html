{% extends "layout.html" %}

{% block mainContent %}
    <!-- Page content-->
    <div class="container my-5">
        <div class="row">
            <div class="d-flex justify-content-between mb-2">
            <h3>Update Post</h3>
                <a class="btn btn-success" href="{% url 'post:index' %}" role="button">Back</a>
            </div>
            <!-- Blog entries-->
            <div class="col-lg-12">
                <div class="card p-3">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}"/>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea
                            class="form-control"
                            id="content"
                            name="content"
                            rows="5"
                            >{{ post.content }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="thumbnail" class="form-label">Choose Thumbnail</label>
                            {% if post.thumbnail %}
                                <div class="mb-2">
                                    <p>Current Image:</p>
                                    <img src="{{ post.thumbnail.url }}" alt="Current Thumbnail" style="max-width: 200px;">
                                </div>
                            {% endif %}
                            <p>Upload a new image and change it:</p>
                            <input
                            class="form-control"
                            type="file"
                            id="thumbnail"
                            name="thumbnail"
                            />
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select
                            class="form-select"
                            name="category"
                            aria-label="Default select example"
                            >
                            <option selected>Select Category</option>
                            {% for item in category %}
                                <option value="{{ item.id }}" {% if item.id == post.category.id %}selected{% endif %}>{{ item.name }}</option>
                            {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="tags" class="form-label">Tag</label>
                            <div class="tag-wrapper">
                                {% for item in tag %}
                                    <div class="form-check form-check-inline">
                                        <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="tags"
                                        value="{{ item.id }}"
                                        id="tag_{{ item.id }}"
                                        {% if item in post.tag.all%}checked{% endif %}
                                        />
                                        <label class="form-check-label" for="tag_{{ item.id }}">{{ item.name }}</label>
                                    </div>
                                {% endfor %}
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock mainContent %}
